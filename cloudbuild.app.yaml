steps:
  # E3 adaptation: deploy a dedicated Cloud Run service for event-driven experiment E3.
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.app
      - -t
      - europe-west1-docker.pkg.dev/dept-dinl-angela/cookie-jar/cookie-jar-app:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west1-docker.pkg.dev/dept-dinl-angela/cookie-jar/cookie-jar-app:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - cookie-jar-app-e3
      - --image=europe-west1-docker.pkg.dev/dept-dinl-angela/cookie-jar/cookie-jar-app:$COMMIT_SHA
      - --region=europe-west1
      - --platform=managed
      - --service-account=angela-masters@dept-dinl-angela.iam.gserviceaccount.com
      - --add-cloudsql-instances=dept-dinl-angela:europe-west1:cookie-jar-masters
      - --concurrency=8
      - --min-instances=4
      - --max-instances=10
      - --cpu=2
      - --memory=4Gi
      - --timeout=3600
      - --set-env-vars=FLASK_DEBUG=0,DB_USER=postgres,DB_NAME=postgres,CLOUD_SQL_CONNECTION_NAME=dept-dinl-angela:europe-west1:cookie-jar-masters
      - --set-secrets=DB_PASSWORD=cookie-jar-masters-db-password:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        # E3 adaptation: create an Eventarc trigger so e3 benchmark uploads invoke /scan/events/storage-finalized.
        # E3 adaptation: escape shell vars with $$ so Cloud Build doesn't treat them as template substitutions.
        set -euo pipefail
        TRIGGER_NAME="cookie-jar-app-e3-storage-finalized"
        REGION="europe-west1"
        SA="angela-masters@dept-dinl-angela.iam.gserviceaccount.com"
        if gcloud eventarc triggers describe "$$TRIGGER_NAME" --location="$$REGION" >/dev/null 2>&1; then
          gcloud eventarc triggers delete "$$TRIGGER_NAME" --location="$$REGION" --quiet
        fi
        gcloud eventarc triggers create "$$TRIGGER_NAME" \
          --location="$$REGION" \
          --destination-run-service=cookie-jar-app-e3 \
          --destination-run-region="$$REGION" \
          --destination-run-path=/scan/events/storage-finalized \
          --event-filters=type=google.cloud.storage.object.v1.finalized \
          --event-filters=bucket=e3-data-benchmarks \
          --service-account="$$SA"

options:
  logging: CLOUD_LOGGING_ONLY

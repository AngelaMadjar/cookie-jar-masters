steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.app
      - -t
      - europe-west1-docker.pkg.dev/dept-dinl-angela/cookie-jar/cookie-jar-app:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west1-docker.pkg.dev/dept-dinl-angela/cookie-jar/cookie-jar-app:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - cookie-jar-app-e2
      - --image=europe-west1-docker.pkg.dev/dept-dinl-angela/cookie-jar/cookie-jar-app:$COMMIT_SHA
      - --region=europe-west1
      - --platform=managed
      - --service-account=angela-masters@dept-dinl-angela.iam.gserviceaccount.com
      - --add-cloudsql-instances=dept-dinl-angela:europe-west1:cookie-jar-masters
      - --concurrency=8
      - --max-instances=4
      - --set-env-vars=FLASK_DEBUG=0,DB_USER=postgres,DB_NAME=cookie-jar-masters,CLOUD_SQL_CONNECTION_NAME=dept-dinl-angela:europe-west1:cookie-jar-masters
      - --set-secrets=DB_PASSWORD=cookie-jar-masters-db-password:latest

options:
  logging: CLOUD_LOGGING_ONLY
